name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Content is up to date with docs-source
        run: |
          npm run generate-content
          git diff --exit-code content/ || {
            echo "content/*.json diverge de docs-source/ — lancez npm run generate-content et committez."
            exit 1
          }

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Tests
        run: npm test -- --ci
