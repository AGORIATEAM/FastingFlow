<main class="min-h-screen flex flex-col items-center justify-between px-margin_mobile py-xl bg-mesh relative overflow-hidden">

<div class="w-full flex justify-end z-10">

            </button>
</div>
<!-- Carousel Container -->
<div class="flex-1 w-full max-w-md flex flex-col items-center justify-center relative z-10">
<!-- Slide 1 Content (Active State Visualized) -->
<div class="w-full flex flex-col items-center text-center space-y-xl">
<!-- Visual Illustration Area -->
<div class="relative w-72 h-72 flex items-center justify-center">
<!-- Glassmorphic Outer Ring -->
<div class="absolute inset-0 rounded-full border border-white/5 bg-secondary/5 blur-sm"></div>
<!-- Decorative Radial Elements -->
<div class="absolute inset-4 rounded-full border-2 border-dashed border-secondary/20 animate-[spin_20s_linear_infinite]"></div>
<!-- Main Graphic: Scientific Timer Concept -->
<div class="glass-panel w-56 h-56 rounded-full flex flex-col items-center justify-center shadow-2xl shadow-secondary/10">
<span class="material-symbols-outlined text-secondary text-5xl mb-sm" style="font-variation-settings: 'wght' 200;">timer</span>
<div class="font-display-timer text-h1 text-secondary">16:00</div>
<div class="text-label-sm text-secondary/60 uppercase">Heures de jeûne</div>
</div>
<!-- Floating Metric Nodes -->
<div class="absolute top-0 right-4 glass-panel px-sm py-xs rounded-lg flex items-center gap-xs shadow-lg">
<span class="material-symbols-outlined text-tertiary text-sm" data-weight="fill">bolt</span>
<span class="text-[10px] font-bold text-white">Cétose</span>
</div>
</div>
<!-- Text Content -->
<div class="space-y-md">
<h1 class="font-h1 text-white leading-tight">Suis ton jeûne en temps réel</h1>
<p class="text-on-surface-variant font-body-lg max-w-[280px] mx-auto">
                        Visualisez chaque étape de votre métabolisme avec une précision médicale.
                    </p>
</div>
</div>
<!-- Carousel Indicators -->
<div class="flex gap-sm mt-xxl">
<div class="h-1.5 w-8 rounded-full bg-secondary transition-all"></div>
<div class="h-1.5 w-2 rounded-full bg-surface-variant transition-all"></div>
<div class="h-1.5 w-2 rounded-full bg-surface-variant transition-all"></div>
</div>
</div>
<!-- Action Area -->
<div class="w-full max-w-md space-y-md z-10">
<button class="w-full bg-secondary-container hover:bg-secondary text-on-secondary-fixed font-h2 py-lg rounded-full shadow-[0_8px_30px_rgb(0,154,215,0.3)] transition-all active:scale-[0.98] flex items-center justify-center gap-sm">
                Suivant
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-label-sm text-on-surface-variant/60">
                Étape 1 sur 3
            </p>
</div>

<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-secondary/10 rounded-full blur-[80px]"></div>
<div class="absolute -top-24 -right-24 w-80 h-80 bg-tertiary/5 rounded-full blur-[100px]"></div>
