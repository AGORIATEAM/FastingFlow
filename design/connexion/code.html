<body class="antialiased font-body-md text-on-surface selection:bg-secondary-container/30">
<!-- Top Navigation Anchor (Shared Component Mapping) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-5 h-16 bg-[#0D2547]/80 backdrop-blur-2xl border-b border-white/10 shadow-lg shadow-[#3DB4F2]/5">
<div class="text-xl font-bold text-white font-h1 tracking-tight">FastLife</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#3DB4F2] cursor-pointer" data-icon="local_fire_department">local_fire_department</span>
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-white/10">
<img alt="User profile" class="w-full h-full object-cover" data-alt="Close-up of a professional modern woman with a calm and confident expression, soft lighting, professional corporate style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuARxlqdqa063Sx6DWoqYlok0iBqCbN_71fKwBUTYG2p6c6xhVlEqousDOKjZ34Jej_vOLMa0BI2p3l19Icp8TG4DhdKfP6oMuYOfghQOu4MBPSQAdXaDftyF_YGwKABno0VjWoi8OAh6J3JExCYjGLI2VBZEt9VqOHCG8tCEKCdJEPkjeKu-qgDLouCE16newZsxYX6suqhqZrQ_sudUVkuC2nmSUtIDeC6tg58CCaBOulYBEoz0KHyZuZ7BInd_3JHrkkS2syIDMRw"/>
</div>
</div>
</header>
<main class="min-h-screen pt-24 pb-12 px-margin_mobile flex flex-col items-center justify-center relative overflow-hidden">
<!-- Abstract Background Glows -->
<div class="absolute top-1/4 -left-20 w-64 h-64 bg-secondary-container/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-tertiary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="w-full max-w-md z-10">
<!-- Header Section -->
<div class="text-center mb-10">
<h1 class="font-h1 text-h1 text-white mb-2">Bienvenue</h1>
<p class="font-body-md text-on-surface-variant">Précision scientifique, bien-être humain.</p>
</div>
<!-- Main Auth Card -->
<div class="glass-card glow-cyan rounded-3xl p-8 mb-xl">
<div class="flex border-b border-white/5 mb-8">
<button class="flex-1 pb-4 font-h2 text-h2 text-secondary border-b-2 border-secondary">Se connecter</button>
<button class="flex-1 pb-4 font-h2 text-h2 text-on-surface-variant/40 hover:text-on-surface-variant transition-colors">S'inscrire</button>
</div>
<form class="space-y-6">
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest pl-1">Adresse e-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xl" data-icon="mail">mail</span>
<input class="w-full bg-[#050F1D]/50 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/30 focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary/50 transition-all font-body-md" placeholder="nom@exemple.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Mot de passe</label>
<a class="text-[12px] text-on-surface-variant/60 hover:text-secondary transition-colors" href="#">Oublié ?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xl" data-icon="lock">lock</span>
<input class="w-full bg-[#050F1D]/50 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/30 focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary/50 transition-all font-body-md" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-gradient-to-r from-[#3DB4F2] to-[#45dfa4] text-on-secondary font-h2 text-h2 py-4 rounded-full shadow-lg shadow-secondary/20 active:scale-95 transition-transform" type="submit">
                        Se connecter
                    </button>
</form>
<!-- Divider -->
<div class="relative my-10 flex items-center">
<div class="flex-grow border-t border-white/5"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-on-surface-variant/40">OU</span>
<div class="flex-grow border-t border-white/5"></div>
</div>
<!-- Social Providers -->
<div class="space-y-4">
<button class="w-full flex items-center justify-center gap-3 bg-white text-black font-h2 text-body-md py-4 rounded-full active:scale-95 transition-transform">

                        Continuer avec Apple
                    </button>
<button class="w-full flex items-center justify-center gap-3 bg-[#0D2547] border border-white/10 text-on-surface font-h2 text-body-md py-4 rounded-full active:scale-95 transition-transform hover:bg-white/5 transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>

                    </button>
<button class="w-full flex items-center justify-center gap-3 bg-[#1877F2] text-white font-h2 text-body-md py-4 rounded-full active:scale-95 transition-transform">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path></svg>
                        Continuer avec Facebook
                    </button>
</div>
</div>
<!-- Footer Text -->
<p class="text-center font-label-sm text-on-surface-variant/40 px-6">
                En continuant, vous acceptez nos <a class="underline hover:text-secondary" href="#">Conditions d'utilisation</a> et notre <a class="underline hover:text-secondary" href="#">Politique de confidentialité</a>.
            </p>
</div>
