<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#4d5f80",
                        "primary-fixed-dim": "#b4c7ed",
                        "on-primary-container": "#7587ab",
                        "on-secondary-container": "#002d42",
                        "background": "#050F1D",
                        "error-container": "#93000a",
                        "primary-container": "#0a1f3d",
                        "on-surface": "#e4e2e5",
                        "on-surface-variant": "#c5c6ce",
                        "tertiary-container": "#002517",
                        "secondary-fixed-dim": "#84cfff",
                        "on-primary-fixed": "#061b39",
                        "on-error-container": "#ffdad6",
                        "error": "#ffb4ab",
                        "outline": "#8e9098",
                        "on-secondary-fixed-variant": "#004c6c",
                        "on-secondary": "#00344c",
                        "secondary": "#84cfff",
                        "surface-container-high": "#292a2c",
                        "surface-tint": "#b4c7ed",
                        "on-background": "#e4e2e5",
                        "on-primary-fixed-variant": "#354767",
                        "surface-container-lowest": "#0d0e10",
                        "surface-container": "#0D2547",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#001e2e",
                        "on-tertiary-fixed": "#002114",
                        "secondary-container": "#009ad7",
                        "surface-variant": "#343537",
                        "outline-variant": "rgba(245, 247, 250, 0.1)",
                        "on-tertiary-container": "#009a6c",
                        "primary-fixed": "#d6e3ff",
                        "inverse-surface": "#e4e2e5",
                        "tertiary-fixed-dim": "#45dfa4",
                        "on-tertiary": "#003825",
                        "surface": "#050F1D",
                        "on-primary": "#1e304f",
                        "secondary-fixed": "#c7e7ff",
                        "tertiary-fixed": "#68fcbf",
                        "surface-container-low": "#1b1b1e",
                        "primary": "#3DB4F2",
                        "surface-container-highest": "#343537",
                        "on-tertiary-fixed-variant": "#005137",
                        "surface-dim": "#131316",
                        "inverse-on-surface": "#303033",
                        "surface-bright": "#39393c",
                        "tertiary": "#45dfa4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin_mobile": "20px",
                        "md": "16px",
                        "lg": "24px",
                        "sm": "8px",
                        "xl": "32px",
                        "xxl": "48px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "h2": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "h1": ["Inter"],
                        "display-timer": ["Space Grotesk"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "display-timer": ["72px", {"lineHeight": "1", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(13, 37, 71, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 247, 250, 0.1);
        }
        .active-goal {
            border-color: #3DB4F2;
            background: rgba(61, 180, 242, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen">
<!-- Progress Bar Section -->
<header class="fixed top-0 left-0 w-full z-50 bg-background/80 backdrop-blur-md px-margin_mobile h-16 flex items-center">
<div class="w-full h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/2 transition-all duration-500 ease-out shadow-[0_0_12px_rgba(61,180,242,0.4)]"></div>
</div>
</header>
<main class="pt-24 pb-32 px-margin_mobile max-w-xl mx-auto">
<!-- Step Indicator -->
<div class="mb-sm">
<span class="font-label-sm text-label-sm text-on-primary-container uppercase tracking-widest">Étape 2 sur 4</span>
</div>
<!-- Section: Personal Information -->
<section class="mb-xxl">
<h1 class="font-h1 text-h1 text-white mb-md">Parlez-nous de vous</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">Ces données nous permettent de calibrer vos cycles métaboliques avec précision.</p>
<div class="space-y-lg">
<!-- Prénom -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">PRÉNOM</label>
<input class="w-full glass-card rounded-xl px-md py-lg text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-slate-600" placeholder="Entrez votre prénom" type="text"/>
</div>
<div class="grid grid-cols-2 gap-md">
<!-- Âge -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">ÂGE</label>
<input class="w-full glass-card rounded-xl px-md py-lg text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-slate-600" placeholder="Ans" type="number"/>
</div>
<!-- Genre -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">GENRE</label>
<select class="w-full glass-card rounded-xl px-md py-lg text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all appearance-none">
<option>Homme</option>
<option>Femme</option>
<option>Autre</option>
</select>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<!-- Poids -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">POIDS (KG)</label>
<input class="w-full glass-card rounded-xl px-md py-lg text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-slate-600" placeholder="70" type="number"/>
</div>
<!-- Taille -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">TAILLE (CM)</label>
<input class="w-full glass-card rounded-xl px-md py-lg text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-slate-600" placeholder="175" type="number"/>
</div>
</div>
</div>
</section>
<!-- Section: Goal Selection -->
<section class="mb-xxl">
<h2 class="font-h2 text-h2 text-white mb-md">Quel est votre objectif ?</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">Sélectionnez la raison principale de votre jeûne.</p>
<div class="grid grid-cols-1 gap-md">
<!-- Goal Card: Perte de poids -->
<button class="glass-card active-goal flex items-center p-lg rounded-xl text-left transition-all active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center mr-md group-hover:bg-primary/30 transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="monitor_weight">monitor_weight</span>
</div>
<div>
<p class="font-h2 text-body-lg text-white">Perte de poids</p>
<p class="font-body-md text-label-sm text-on-surface-variant">Optimisation de la combustion des graisses</p>
</div>
</button>
<!-- Goal Card: Énergie -->
<button class="glass-card flex items-center p-lg rounded-xl text-left transition-all active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-md group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="bolt">bolt</span>
</div>
<div>
<p class="font-h2 text-body-lg text-white">Énergie</p>
<p class="font-body-md text-label-sm text-on-surface-variant">Amélioration de la clarté mentale</p>
</div>
</button>
<!-- Goal Card: Longévité -->
<button class="glass-card flex items-center p-lg rounded-xl text-left transition-all active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-md group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="auto_awesome">auto_awesome</span>
</div>
<div>
<p class="font-h2 text-body-lg text-white">Longévité</p>
<p class="font-body-md text-label-sm text-on-surface-variant">Stimulation de l'autophagie cellulaire</p>
</div>
</button>
<!-- Goal Card: Santé métabolique -->
<button class="glass-card flex items-center p-lg rounded-xl text-left transition-all active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-md group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="vital_signs">vital_signs</span>
</div>
<div>
<p class="font-h2 text-body-lg text-white">Santé métabolique</p>
<p class="font-body-md text-label-sm text-on-surface-variant">Régulation de l'insuline et glycémie</p>
</div>
</button>
</div>
</section>
<!-- Decorative Scientific Background Detail -->
<div class="fixed bottom-24 -right-16 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full p-margin_mobile bg-gradient-to-t from-background via-background/90 to-transparent">
<div class="max-w-xl mx-auto">
<button class="w-full bg-primary text-on-primary h-14 rounded-full font-h2 text-body-lg flex items-center justify-center shadow-[0_8px_24px_rgba(61,180,242,0.3)] hover:scale-[1.02] active:scale-95 transition-all">
                Suivant
                <span class="material-symbols-outlined ml-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
<!-- Profile Background Visual -->
<div class="fixed top-0 right-0 p-8 opacity-20 pointer-events-none hidden lg:block">
<div class="w-96 h-96 rounded-full border border-primary/20 flex items-center justify-center">
<div class="w-64 h-64 rounded-full border border-primary/10 flex items-center justify-center">
<div class="w-32 h-32 rounded-full bg-primary/5 blur-xl"></div>
</div>
</div>
</div>
</body></html>
